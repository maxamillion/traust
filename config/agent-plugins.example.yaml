# Agent plugins this deployment depends on — the freshness roster for
# `check drift`'s `agent-plugins:*` rows.
#
# Why this file exists separately from config/external-tools.yaml: that
# manifest describes a BINARY (a `version_cmd` to run, a GitHub release to
# compare against). A Claude Code plugin has neither, so adopting one would
# otherwise leave a dependency nothing watches.
#
# What the rows do:
#   installed version != the version the marketplace publishes -> `stale`
#   declared here but not installed                            -> `pending`
#   non-https repo                                             -> refused
#
# No check may auto-advance a pin: the row reports, a human runs
# `/plugin update <name>` and re-reviews the dependency's row in
# docs/external-dependencies.md — upstream can change a skill's behaviour
# AND its licence terms between versions.
#
# Plugins are a per-workstation install, so this row is silent on a headless
# runner that has no ~/.claude/plugins/installed_plugins.json.
#
# Copy to $TRAUST_CONFIG_HOME/agent-plugins.yaml and edit. An absent file
# means nothing is watched, which is the correct default for a deployment
# that uses no plugins.

plugins: []

# Example — a CC BY-SA marketplace used at runtime and never adapted into
# this tree (see docs/external-dependencies.md for why that distinction
# matters, and the content guard's rule 6 for how it is enforced):
#
#  - name: review-walkthrough
#    marketplace: trailofbits
#    repo: https://github.com/trailofbits/skills
#    consumers: [patch, remediate-finding]
