# Template for $TRAUST_CONFIG_HOME/execution-boundaries.yaml — install_traust
# seeds it; copy there and edit. The harness never reads this example at run
# time.
#
# How the lanes that run a TARGET repository's own build/test code execute it:
# the Phase 4 checks, the Phase 4b mutation campaign, the property
# differential. Set once here rather than per-invocation, so every runner in a
# deployment behaves the same way.
#
#   none    Run directly. Environment is scrubbed and the work happens on a
#           disposable copy, never your worktree, but the process itself is
#           the only isolation. This is the DEFAULT: it is what a workstation
#           does today, and what a runner that is already a locked-down job
#           needs, since such a job usually cannot nest a container.
#
#   podman  Run inside a nested container: rootless, cap-dropped,
#           no-new-privileges, credential-free, --network=none, digest-pinned
#           image. Stronger. Requires a WORKING runtime — if podman cannot
#           run, the lane reports `not_attempted` rather than quietly falling
#           back to `none`, because silently weakening the boundary you asked
#           for is worse than producing no evidence.
#
# The mode that produced a result is recorded in every evidence item's
# `command` field, so a reader can weigh a nested-podman verdict differently
# from a direct one.

version: 1

sandbox: none
